<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PropertyGuru Shortlist Scraper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 280px;
      padding: 16px;
      background: #fff;
      color: #1a1a1a;
    }
    h1 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #cc0000;
    }
    p.subtitle {
      font-size: 11px;
      color: #666;
      margin-bottom: 16px;
    }
    button {
      width: 100%;
      padding: 10px 14px;
      background: #cc0000;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover:not(:disabled) { background: #aa0000; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #status {
      margin-top: 12px;
      font-size: 12px;
      min-height: 18px;
      color: #444;
      text-align: center;
    }
    #status.error { color: #cc0000; }
    #status.success { color: #1a7a1a; }
    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #ccc;
      border-top-color: #cc0000;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 4px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .warning {
      background: #fff8e1;
      border: 1px solid #ffe082;
      border-radius: 4px;
      padding: 8px 10px;
      font-size: 11px;
      color: #5d4037;
      margin-bottom: 12px;
      display: none;
    }
    .warning.visible { display: block; }
  </style>
</head>
<body>
  <h1>PropertyGuru Shortlist</h1>
  <p class="subtitle">Scrapes all shortlisted listings and exports as JSON</p>
  <div class="warning" id="warning">
    Navigate to your PropertyGuru shortlist page first.
  </div>
  <button id="exportBtn">Export Shortlist</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
